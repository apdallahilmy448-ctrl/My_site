<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقعي الشخصي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0f172a;
            color: white;
            padding: 50px 20px;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 {
            color: #38bdf8;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>أهلاً بيكم في موقعي الأول! 🚀</h1>
        <p>تم تصميم وبرمجة هذا الموقع بالكامل من خلال المتصفح.</p>
        <a href="#" class="btn">تواصل معي</a>
    </div>

</body>
</html>
